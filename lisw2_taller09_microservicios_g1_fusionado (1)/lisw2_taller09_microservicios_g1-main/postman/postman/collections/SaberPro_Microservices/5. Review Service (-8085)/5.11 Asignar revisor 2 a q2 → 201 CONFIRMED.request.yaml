$kind: http-request
url: "{{review_service_url}}/reviews/assign"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "questionId": {{question2_id}},
      "reviewerId": {{reviewer2_id}},
      "assignedBy": {{admin_id}}
    }
scripts:
  - type: afterResponse
    code: pm.test('HTTP 201', function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 11000
