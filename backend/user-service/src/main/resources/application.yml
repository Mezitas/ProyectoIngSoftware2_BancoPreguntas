server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:h2:mem:userservice;DB_CLOSE_DELAY=-1}
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/saberpro}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/saberpro/protocol/openid-connect/certs}

keycloak:
  token-url: ${KEYCLOAK_TOKEN_URL:http://localhost:8180/realms/saberpro/protocol/openid-connect/token}
  client-id: ${KEYCLOAK_CLIENT_ID:saberpro-desktop}
