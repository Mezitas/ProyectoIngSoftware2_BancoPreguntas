$kind: http-request
url: "{{lifecycle_service_url}}/lifecycle/{{question_id}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', function () { pm.response.to.have.status(200); });
      pm.test('PENDING_REVIEW', function () { pm.expect(pm.response.json().status).to.eql('PENDING_REVIEW'); });
    language: text/javascript
order: 1000
