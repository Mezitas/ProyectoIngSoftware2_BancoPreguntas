$kind: http-request
url: "{{lifecycle_service_url}}/lifecycle/{{question_id}}/transition"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "targetState": "REJECTED",
      "requestedBy": {{admin_id}}
    }
scripts:
  - type: afterResponse
    code: pm.test('HTTP 400', function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 6000
